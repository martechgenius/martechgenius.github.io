name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: configure-hugo/hugo-setup@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Download PaperMod Theme
        run: |
          mkdir -p themes/PaperMod
          curl -sSL https://github.com/adityatelange/hugo-PaperMod/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C themes/PaperMod

      - name: Build Hugo Site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
