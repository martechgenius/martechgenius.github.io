baseURL = "https://martechgenius.github.io/"
languageCode = "it-it"
defaultContentLanguage = "it"
title = "MarTech Genius"
theme = "PaperMod"

# --- GOOGLE ANALYTICS 4 ---
googleAnalytics = "G-S05879Z1TC"

# --- ABILITA RSS / FEED ---
[outputs]
  home = ["HTML", "RSS", "JSON"]

# --- CONFIGURAZIONE PARAMS & SEARCH CONSOLE ---
[params]
  env = "production"
  title = "MarTech Genius"
  description = "Guida e recensioni indipendenti ai migliori strumenti di Marketing Automation, CRM e Digital Marketing."
  keywords = ["martech", "email marketing", "automazioni", "crm", "activecampaign", "make"]
  author = "MarTech Genius Team"
  
  # --- STILE E TEMI ---
  defaultTheme = "auto"
  disableThemeToggle = false

  # --- GOOGLE SEARCH CONSOLE ---
  googleSiteVerification = "jrSWz71HE_c7xkU8wPGYXCzV79JjhTaQxvR"

  # --- LAYOUT E HOME ---
  showToc = true
  TocOpen = false
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true

  # --- HOMEPAGE RICCA E STRUTTURATA ---
  [params.homeInfoParams]
    # --- MODALITÀ PROFILO HOME (Molto più moderna) ---
  [params.profileMode]
    enabled = true
    title = "MarTech Genius 🚀"
    subtitle = "Recensioni indipendenti, comparazioni e guide pratiche sui migliori strumenti di Marketing Automation e CRM per far scalare il tuo business."
    imageUrl = "" # Possiamo aggiungere un logo qui in seguito
    imageTitle = "MarTech Genius"
    buttons = [
      { name = "Esplora le Recensioni 📚", url = "/posts/" },
      { name = "Chi Siamo", url = "/about/" }
    ]

# --- MENU DI NAVIGAZIONE ---
[[menu.main]]
  name = "Articoli"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "Chi Siamo"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Disclaimer"
  url = "/disclaimer-affiliazione/"
  weight = 3

[[menu.main]]
  name = "Privacy Policy"
  url = "/privacy-policy/"
  weight = 4

[[menu.main]]
  name = "Contatti"
  url = "/contact/"
  weight = 5
